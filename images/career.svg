<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#e8f0fe"/>

  <!-- briefcase -->
  <g transform="translate(130,60)">
    <rect x="0" y="30" width="140" height="90" rx="10" fill="#1f3a5f"/>
    <rect x="45" y="10" width="50" height="28" rx="6" fill="none" stroke="#1f3a5f" stroke-width="6"/>
    <rect x="0" y="60" width="140" height="18" fill="#ffb703"/>
    <rect x="60" y="60" width="20" height="20" rx="4" fill="#ffffff"/>
  </g>

  <!-- upward arrow badge (career growth) -->
  <circle cx="300" cy="70" r="30" fill="#ffb703"/>
  <path d="M288 82 L300 58 L312 82" stroke="#1f3a5f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f3a5f" font-weight="bold">
    Career
  </text>
</svg>

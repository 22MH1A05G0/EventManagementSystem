    <rect x="0" y="60" width="180" height="14" rx="4" fill="#1f3a5f"/>
    <path d="M20 60 L10 0 H170 L160 60 Z" fill="#ffffff" stroke="#1f3a5f" stroke-width="4"/>
    <rect x="30" y="14" width="120" height="36" fill="#1f3a5f" opacity="0.15"/>

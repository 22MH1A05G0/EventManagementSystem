<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="100%" stop-color="#2f5480"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#heroBg)"/>

  <!-- decorative circles -->
  <circle cx="80" cy="60" r="40" fill="#ffffff" opacity="0.06"/>
  <circle cx="930" cy="230" r="70" fill="#ffffff" opacity="0.06"/>
  <circle cx="850" cy="50" r="25" fill="#ffb703" opacity="0.5"/>

  <!-- calendar icon -->
  <g transform="translate(400,60)">
    <rect x="0" y="20" width="200" height="170" rx="12" fill="#ffffff"/>
    <rect x="0" y="20" width="200" height="45" rx="12" fill="#ffb703"/>
    <rect x="30" y="0" width="14" height="40" rx="6" fill="#ffffff"/>
    <rect x="156" y="0" width="14" height="40" rx="6" fill="#ffffff"/>

    <!-- grid of date squares -->
    <g fill="#e8f0fe">
      <rect x="20" y="80" width="28" height="22" rx="4"/>
      <rect x="58" y="80" width="28" height="22" rx="4"/>
      <rect x="96" y="80" width="28" height="22" rx="4"/>
      <rect x="134" y="80" width="28" height="22" rx="4"/>
      <rect x="20" y="112" width="28" height="22" rx="4"/>
      <rect x="58" y="112" width="28" height="22" rx="4"/>
      <rect x="96" y="112" width="28" height="22" rx="4" fill="#1f3a5f"/>
      <rect x="134" y="112" width="28" height="22" rx="4"/>
      <rect x="20" y="144" width="28" height="22" rx="4"/>
      <rect x="58" y="144" width="28" height="22" rx="4"/>
      <rect x="96" y="144" width="28" height="22" rx="4"/>
      <rect x="134" y="144" width="28" height="22" rx="4"/>
    </g>
  </g>
</svg>
